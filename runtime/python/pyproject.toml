[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-workbench-runtime"
version = "0.1.0-alpha.1"
description = "Small, deterministic, cross-plugin runtime primitives for the SharePoint Knowledge Workbench plugin family. Not a general-purpose shared-utility distribution — scope is narrowly limited to what is explicitly approved (see docs/superpowers/specs/phase-4-5-core-knowledge-plugin-domain-refactoring-spec.md §13c)."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
