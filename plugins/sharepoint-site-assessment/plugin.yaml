name: sharepoint-site-assessment
version: 0.1.0-alpha.1
description: "Read-only assessment of classic and modern SharePoint sites: analyzes exported inventories and schemas offline (per-page migration complexity scoring, web-part behavior grouping, site navigation depth, custom-form classification, permissions and broken inheritance, schema export comparison, choice columns, calculated columns) and collects them live with read-only PnP.PowerShell/on-prem collectors for lists, libraries, content types and pages. Analysis rules and behavioral knowledge are caller-supplied, never built in; no workflow writes to a tenant. Includes recursive CSV file inventories across all libraries and subsites on Online or on-prem, with interactive authentication and explicit partial-result reporting."
author: Richard Fremmerlid
kind: backend
platforms:
  - linux
  - macos
  - windows
skills:
  - sharepoint-analyze-custom-forms
  - sharepoint-analyze-page-inventory
  - sharepoint-analyze-permissions
  - sharepoint-analyze-site-navigation
  - sharepoint-analyze-webpart-behavior
  - sharepoint-audit-managed-metadata
  - sharepoint-audit-onprem-schema-drift
  - sharepoint-collect-site-inventory
  - sharepoint-compare-schema-exports
  - sharepoint-extract-calculated-columns
  - sharepoint-extract-choice-columns
  - sharepoint-generate-assessment-reports
agents:
  - sharepoint-discovery-agent
