[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-analysis"
version = "0.1.0-alpha.1"
description = "Semantic structure analysis for the SharePoint Knowledge Workbench: topic-boundary reasoning, chunking-strategy recommendation, and draft-plan construction from a normalized-source-document."
requires-python = ">=3.10"
# No dependency on source-document-extraction or any other workbench
# distribution -- this plugin must install and run standalone. See
# docs/superpowers/plans/phase-4-5-evidence/wave-2-contract-materialization-correction.md
# and wave-2-flat-scripts-correction.md for the model this follows.
dependencies = []

[tool.setuptools]
py-modules = ["analysis", "identity", "topic_grouping", "plans", "plan_hashing"]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["plan_schema", "plan_schema.*"]

[tool.setuptools.package-dir]
"" = "scripts"
