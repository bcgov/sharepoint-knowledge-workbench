[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharepoint-migration-planning"
version = "0.1.0-alpha.1"
description = "Deterministic SharePoint dependency-graph analysis and wave-order computation (Stage 3a), plus wave-order planning as its own skill (plan-sharepoint-deployment-waves). wave_planning.py is authored here directly (moved from sharepoint-provisioning 2026-08-08, which never called it internally); provisioning_outcomes.py is reused from sharepoint-provisioning via a managed file symlink -- this wheel is self-contained (symlinks resolve to real file content at build time), no sibling plugin needs co-installing at runtime."
requires-python = ">=3.10"
# No runtime dependency on any other workbench distribution -- provisioning_outcomes.py
# is included via a managed file-level symlink (symlinks.json), matching sharepoint-content-
# publication's proven pattern for the same isolation requirement (plugin-architecture-policy.md
# 1.3, Phase 9 spec section 14). wave_planning.py is a real file in this plugin, not symlinked.
dependencies = []

[tool.setuptools]
py-modules = [
    "dependency_graph",
    "completeness_checks",
    "wave_planning",
    "provisioning_outcomes",
]

[tool.setuptools.package-dir]
"" = "scripts"
