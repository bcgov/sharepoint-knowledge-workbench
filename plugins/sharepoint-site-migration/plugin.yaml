name: sharepoint-site-migration
version: 0.1.0-alpha.1
description: "Plans and executes SharePoint site migration: validates a source-site export, derives the object dependency graph and migration wave plan, scaffolds wave scripts, analyzes and modernizes classic pages (plan, preview, single and library conversion, validation, reports), migrates list content with two-pass lookup re-linking, and extracts and updates links in pages, documents and rich-text columns. Planning and analysis are read-only; most writing scripts are dry-run by default, gated behind -Execute plus an operation-specific -ConfirmToken; the preserved consumer-specific repair script in the content-audit folder is a documented exception (it writes unless -DryRun is passed), so check each script's own parameters."
author: Richard Fremmerlid
kind: backend
platforms:
  - linux
  - macos
  - windows
skills:
  - sharepoint-analyze-classic-pages
  - sharepoint-analyze-migration-dependencies
  - sharepoint-audit-list-migration
  - sharepoint-convert-legacy-aspx-to-html
  - sharepoint-convert-page-library-to-modern
  - sharepoint-convert-page-to-modern
  - sharepoint-create-page-preview
  - sharepoint-extract-links
  - sharepoint-generate-modernization-report
  - sharepoint-initialize-migration-project
  - sharepoint-migrate-list-content
  - sharepoint-normalize-migration-inventory
  - sharepoint-plan-migration-waves
  - sharepoint-plan-page-modernization
  - sharepoint-scaffold-migration-wave-scripts
  - sharepoint-update-links-in-documents
  - sharepoint-update-page-links
  - sharepoint-update-rich-text-image-links
  - sharepoint-validate-link-integrity
  - sharepoint-validate-page-modernization
agents:
  - sharepoint-content-migration-sequencing-agent
  - sharepoint-deployment-planning-agent
  - sharepoint-deployment-sequencing-agent
  - sharepoint-link-agent
  - sharepoint-link-remediation-analysis-agent
  - sharepoint-modernization-agent
  - sharepoint-webpart-modernization-analysis-agent
