[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canonical-knowledge"
version = "0.1.0-alpha.1"
description = "Canonical content package construction for the SharePoint Knowledge Workbench: cleanup, chunking, validation, and atomic promotion from a confirmed analysis-plan."
requires-python = ">=3.10"
# No dependency on source-document-extraction, knowledge-analysis, or any
# other workbench distribution -- this plugin must install and run
# standalone. See
# docs/superpowers/plans/phase-4-5-evidence/wave-2-contract-materialization-correction.md
# and wave-2-flat-scripts-correction.md for the model this follows.
dependencies = []

[tool.setuptools]
py-modules = [
    "canonical_knowledge",
    "package",
    "canonical_package",
    "chunking",
    "chunk_identity",
    "chunk_grouping",
    "dispositions",
    "media_disposition",
    "publication_map",
    "hashing",
    "validate_canonical",
    "atomic_output",
    "convert",
    "plan_verification",
    "emf_convert",
]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["canonical_schema", "canonical_schema.*", "pandoc_cleanup", "pandoc_cleanup.*"]

[tool.setuptools.package-dir]
"" = "scripts"
