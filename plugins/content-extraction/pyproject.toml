[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-extraction"
version = "0.1.0-alpha.1"
description = "Source-format inspection and extraction for the SharePoint Knowledge Workbench."
requires-python = ">=3.10"
# No dependency on knowledge-workbench-contracts or any other workbench
# distribution -- this plugin must install and run standalone. See
# docs/superpowers/plans/phase-4-5-evidence/wave-2-contract-materialization-correction.md.
dependencies = []

[tool.setuptools]
py-modules = [
    "extraction",
    "dependencies",
    "emf_convert",
    "heading_parsing",
    "path_safety",
]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["schema", "schema.*", "pandoc", "pandoc.*"]

[tool.setuptools.package-dir]
"" = "scripts"

[tool.pytest.ini_options]
pythonpath = ["scripts"]
