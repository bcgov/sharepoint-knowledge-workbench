name: sharepoint-discovery
version: 0.1.0-alpha.1
description: "Collects and analyzes classic/modern SharePoint site inventories and schemas: per-page migration complexity scoring, functional grouping of web-part code, site navigation depth analysis, custom-form classification, permissions/broken-inheritance auditing, schema drift auditing, choice field inventory, calculated column extraction, and read-only PnP.PowerShell/on-prem collectors for lists, libraries, content types, and ASPX pages. Analysis rules and behavioural knowledge are caller-supplied, never built in; live collection is read-only, zero tenant writes."
author: Richard Fremmerlid
kind: backend
platforms:
  - linux
  - macos
  - windows
agents:
  - sharepoint-discovery-agent
skills:
  - sharepoint-analyze-custom-forms
  - sharepoint-analyze-page-inventory
  - sharepoint-analyze-permissions
  - sharepoint-analyze-site-navigation
  - sharepoint-analyze-webpart-code
  - sharepoint-audit-managed-metadata
  - sharepoint-audit-onprem-schema-drift
  - sharepoint-audit-schema
  - sharepoint-collect-sharepoint-inventory
  - sharepoint-diff-sharepoint-schema
  - sharepoint-extract-calculated-columns
  - sharepoint-extract-choice-fields
  - sharepoint-generate-discovery-report-set
  - sharepoint-generate-sharepoint-schema-from-export
  - sharepoint-scaffold-schema-definition
