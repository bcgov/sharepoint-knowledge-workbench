name: sharepoint-content-publication
version: 0.1.0-alpha.1
description: "SharePoint tenant publication tooling: packages a rendered publication output, dry-runs the upload plan, and reconciles it against live tenant state. Not yet decomposed to the Phase 4.5 domain-plugin model."
author: Richard Fremmerlid
kind: backend
platforms:
  - linux
  - macos
  - windows
skills:
  - publish-aspx-to-sharepoint
  - publish-markdown-to-sharepoint
  - reconcile-sharepoint-publication
  - rollback-sharepoint-publication
  - upload-content
  - validate-sharepoint-publication
agents:
  - sharepoint-validation-agent
