[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharepoint-document-conversion"
version = "0.1.0-alpha.1"
description = "SharePoint document conversion: extracts a source .docx into a normalized source document, analyzes topic structure and chunking strategy, assembles a validated canonical content package, renders it to multipage Markdown or SharePoint modern pages through local rendering templates, validates the rendered output, and provides single-topic editorial review of rendered Markdown or published pages. Every workflow is local or read-only; nothing in this package writes to a tenant."
requires-python = ">=3.10"
# Every consolidated implementation is dependency-free and runs standalone from its namespace folder.
dependencies = []

# This package bundles several flat-module implementations in namespace folders under scripts/. Same-named
# modules exist in more than one namespace, so there is no single importable distribution of them: scripts run
# from their own folder and tests run one namespace per process (tests/run_namespaces.py). The original
# per-plugin setuptools settings are preserved in references/source-packages/<source-plugin>/pyproject.toml.source.
[tool.setuptools]
py-modules = []
