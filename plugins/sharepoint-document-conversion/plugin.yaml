name: sharepoint-document-conversion
version: 0.1.0-alpha.1
description: "SharePoint document conversion: extracts a source .docx into a normalized source document, analyzes topic structure and chunking strategy, assembles a validated canonical content package, renders it to multipage Markdown or SharePoint modern pages through local rendering templates, validates the rendered output, and provides single-topic editorial review of rendered Markdown or published pages. Every workflow is local or read-only; nothing in this package writes to a tenant."
author: Richard Fremmerlid
kind: backend
platforms:
  - linux
  - macos
  - windows
skills:
  - content-analyze-document-structure
  - content-assemble-structured-content
  - content-compare-rendered-output
  - content-create-markdown-rendering-template
  - content-create-sharepoint-rendering-template
  - content-extract-docx
  - content-render-markdown-pages
  - content-render-sharepoint-pages
  - content-review-manual-topic
  - content-validate-rendered-output
  - content-validate-rendering-template
