name: sharepoint-site-build-and-publish
version: 0.1.0-alpha.1
description: "Creates, configures and publishes SharePoint content: schema definitions (generate, scaffold, compare) and declarative column, content-type, list/library and calendar reconciliation plans (zero tenant I/O), real PnP.PowerShell tenant-write executors for site columns, list columns, content types, views, items, libraries, sites, branding, navigation, permissions and taxonomy, and safe content publication (Markdown files, modern pages, page copy plans, publication-state comparison and removal). Every writing script is dry-run by default, gated behind -Execute plus an operation-specific -ConfirmToken."
author: Richard Fremmerlid
kind: backend
platforms:
  - linux
  - macos
  - windows
skills:
  - sharepoint-add-list-column
  - sharepoint-add-list-item
  - sharepoint-apply-page-publication-plan
  - sharepoint-apply-provisioning-plan
  - sharepoint-compare-publication-state
  - sharepoint-compare-schema-definitions
  - sharepoint-configure-column-formatting
  - sharepoint-configure-library-settings
  - sharepoint-copy-page-between-sites
  - sharepoint-create-content-type
  - sharepoint-create-document-library
  - sharepoint-create-list
  - sharepoint-create-list-view
  - sharepoint-create-site-column
  - sharepoint-detach-content-type
  - sharepoint-generate-schema-definition-from-export
  - sharepoint-plan-column-changes
  - sharepoint-plan-content-type-changes
  - sharepoint-plan-page-publication
  - sharepoint-publish-markdown-files
  - sharepoint-reconcile-calendar-list
  - sharepoint-reconcile-site-schema
  - sharepoint-remove-content-type
  - sharepoint-remove-list
  - sharepoint-remove-list-column
  - sharepoint-remove-publication
  - sharepoint-remove-site-column
  - sharepoint-scaffold-schema-definition
  - sharepoint-update-content-type
  - sharepoint-update-list-column
  - sharepoint-update-list-settings
  - sharepoint-update-site-column
  - sharepoint-validate-publication
agents:
  - sharepoint-validation-agent
