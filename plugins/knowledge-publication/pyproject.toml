[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-publication"
version = "0.1.0-alpha.1"
description = "Renders a validated canonical-package (and publication-map, for grouped packages) to a multipage-markdown publication output, validated and atomically promoted."
requires-python = ">=3.10"
# No dependency on source-document-extraction, knowledge-analysis,
# canonical-knowledge, or any other workbench distribution -- this plugin
# must install and run standalone. See
# docs/superpowers/plans/phase-4-5-evidence/wave-2-contract-materialization-correction.md
# and wave-2-flat-scripts-correction.md for the model this follows.
dependencies = []

[tool.setuptools]
py-modules = [
    "knowledge_publication",
    "render_result",
    "canonical_package",
    "dispositions",
    "hashing",
    "publication_map",
    "path_safety",
    "atomic_output",
]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["canonical_schema", "canonical_schema.*", "renderers", "renderers.*"]

[tool.setuptools.package-dir]
"" = "scripts"
