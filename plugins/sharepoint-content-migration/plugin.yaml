description: "Item-level SharePoint content (list-item data) migration mechanism: batched migration with retry, and the two-pass lookup-ID re-link technique (record a source-to-destination ID mapping during a content pass, resolve lookup fields against it once all target lists exist). Distinct from sharepoint-provisioning (schema/list/field structure, not row data) and sharepoint-page-modernization/sharepoint-link-remediation (pages and links, not list items). Planning is pure; a real apply is dry-run by default and requires both an explicitly injected executor and a plan-derived confirmation token."
author: Richard Fremmerlid
