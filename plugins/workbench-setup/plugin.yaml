name: workbench-setup
version: 0.1.0-alpha.1
description: "Foundational connection/config/workflow setup for the whole workbench: guides app-registration requests (two distinct types -- unattended App-Only/certificate and interactive/delegated), generates the root SharePoint connection config, runs the document-workflow intake wizard, validates written configuration/profile files, and provides live network-reachability/authentication/PnP-effective-capability probing. Zero tenant I/O by default and zero document extraction/rendering -- live probes are opt-in scripts you run yourself."
author: Richard Fremmerlid
kind: backend
platforms:
  - linux
  - macos
  - windows
skills:
  - workbench-initialize-document-workflow
  - workbench-initialize-workbench-config
  - workbench-request-app-registration
  - workbench-resolve-workbench-paths
  - workbench-validate-workbench-environment

