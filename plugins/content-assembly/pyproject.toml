[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-assembly"
version = "0.1.0-alpha.1"
description = "Structured content package assembly for the SharePoint Knowledge Workbench: cleanup, chunking, validation, and atomic promotion from a confirmed conversion plan. (Renamed from canonical-knowledge in the post-Wave-9 naming refactor.)"
requires-python = ">=3.10"
# No dependency on source-document-extraction, document-structure-analysis,
# or any other workbench distribution -- this plugin must install and run
# standalone. See
# docs/superpowers/plans/phase-4-5-evidence/wave-2-contract-materialization-correction.md
# and wave-2-flat-scripts-correction.md for the model this follows.
dependencies = []

[tool.setuptools]
py-modules = [
    "structured_content_assembly",
    "package",
    "canonical_package",
    "chunking",
    "identity_core",
    "topic_boundary_core",
    "dispositions",
    "media_disposition",
    "publication_map",
    "hashing",
    "validate_canonical",
    "atomic_output",
    "convert",
    "plan_verification",
    "emf_convert",
]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["canonical_schema", "canonical_schema.*", "pandoc_cleanup", "pandoc_cleanup.*"]

[tool.setuptools.package-dir]
"" = "scripts"

[tool.pytest.ini_options]
pythonpath = ["scripts"]
