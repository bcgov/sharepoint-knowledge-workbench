name: sharepoint-schema
version: 0.1.0-alpha.1
description: "Read-only SharePoint schema auditing: compares two exported schema snapshots (lists, content types, site columns, per-list fields) for additions/removals/changes, audits a single export for duplicate display names, and inventories Choice/MultiChoice field option sets. Environment labels and compared properties are caller-supplied, never hardcoded. No remediation or write capability."
author: Richard Fremmerlid
kind: backend
platforms:
  - linux
  - macos
  - windows
skills:
  - audit-schema
  - diff-sharepoint-schema
  - extract-choice-fields
  - generate-sharepoint-schema-from-export
agents:
  - sharepoint-schema-agent
