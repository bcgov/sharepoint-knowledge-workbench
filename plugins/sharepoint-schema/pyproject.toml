[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharepoint-schema"
version = "0.1.0-alpha.1"
description = "Read-only, offline SharePoint schema-export loading, comparison, and auditing (site columns, content types, lists/libraries, per-list fields) -- no tenant connection, no write path."
requires-python = ">=3.10"
# No dependency on any other workbench distribution -- this plugin must install and run
# standalone, matching the pip-installable domain plugins' own convention.
dependencies = []

[tool.setuptools]
py-modules = [
    "schema_export",
    "schema_diff",
    "choice_fields",
    "duplicate_fields",
]

[tool.setuptools.package-dir]
"" = "scripts"
